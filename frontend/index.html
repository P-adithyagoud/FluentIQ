<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluentlyAI | Modern AI English Learning Platform</title>
    
    <!-- Meta tags for Search Engine Optimization -->
    <meta name="description" content="FluentlyAI is a production-ready AI-powered English learning platform featuring interactive onboarding, pronunciation tracking, and customizable dashboards.">
    <meta name="keywords" content="AI, English Learning, SaaS, Interactive Onboarding, Language Practice">
    <meta name="author" content="FluentlyAI Team">
    
    <!-- Google Fonts Integration for Clean Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Vector Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Design System Global Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Premium Glowing Background Backdrop Elements -->
    <div class="glass-bg-container">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <!-- Central Routing Viewport Container -->
    <div id="app-viewport">
        <!-- Renders loading skeleton screen prior to app boot -->
        <div class="app-skeleton-loader">
            <div class="skeleton-circle"></div>
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-body-1"></div>
            <div class="skeleton-line skeleton-body-2"></div>
        </div>
    </div>

    <!-- Reusable Glass Toast Notifications Viewport -->
    <div id="toast-container"></div>

    <!-- Core Modular JS SPA Bootstrap Loader -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
